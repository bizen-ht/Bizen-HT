[build]
  functions = "Netlify/Functions"

[functions]
  node_bundler = "esbuild"

# firebase-admin est lourd / a des imports dynamiques : on le laisse "externe"
# (Netlify l'installe depuis package.json au lieu de le bundler avec esbuild).
[functions.webhook]
  external_node_modules = ["firebase-admin"]

[functions.notify]
  external_node_modules = ["firebase-admin"]

[functions.admin-create-user]
  external_node_modules = ["firebase-admin"]

[functions.dm-send]
  external_node_modules = ["firebase-admin"]

[functions.dm-action]
  external_node_modules = ["firebase-admin"]

[functions.dm-cleanup]
  external_node_modules = ["firebase-admin"]
  schedule = "@hourly"

[functions.broadcast]
  external_node_modules = ["firebase-admin"]

[functions.boss]
  external_node_modules = ["firebase-admin"]

[functions.moncash]
  external_node_modules = ["firebase-admin"]

[functions.wallet-pay]
  external_node_modules = ["firebase-admin"]

[functions.wallet-refund]
  external_node_modules = ["firebase-admin"]

[functions.elu-preview]
  external_node_modules = ["firebase-admin"]

# Pages dédiées des agences partenaires : /agence/<slug> -> index avec filtre
[[redirects]]
  from = "/agence/*"
  to = "/index.html?agency=:splat"
  status = 200

[[redirects]]
  from = "/admin.html"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/admin"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/Vye"
  to = "/Vye.html"
  status = 200

# ===== URLs propres (sans .html) =====
[[redirects]]
  from = "/dashboard"
  to = "/Dashboard.html"
  status = 200

# Lien dédié pour le formulaire Elu (ouvre le popup Inskri sur le formulaire Elu)
[[redirects]]
  from = "/elu"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/FAQ.html"
  status = 200

[[redirects]]
  from = "/profil"
  to = "/profil.html"
  status = 200

[[redirects]]
  from = "/kondisyon"
  to = "/kondisyon.html"
  status = 200

[[redirects]]
  from = "/kontra-elu"
  to = "/kontra-elu.html"
  status = 200

# Lien de partage du profil Elu : aperçu (og) via fonction, puis redirection vers l'app
[[redirects]]
  from = "/pwofil/*"
  to = "/.netlify/functions/elu-preview?code=:splat"
  status = 200

[[redirects]]
  from = "/konfidansyalite"
  to = "/konfidansyalite.html"
  status = 200

[[redirects]]
  from = "/regleman"
  to = "/regleman.html"
  status = 200

[[redirects]]
  from = "/success.html"
  to = "/?payment=success"
  status = 302

[[redirects]]
  from = "/error.html"
  to = "/?payment=error"
  status = 302